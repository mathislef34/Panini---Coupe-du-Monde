<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Album Virtuel - Coupe du Monde 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .oswald { font-family: 'Oswald', sans-serif; }

        /* Holographique Classique (Bleu) */
        .holographic {
            background: linear-gradient(135deg, #ff0080, #7928ca, #0070f3, #00dfd8);
            background-size: 400% 400%;
            animation: holo-anim 3s ease infinite;
            opacity: 0.8;
        }

        /* Holographique Doublons (Rouge) */
        .holographic-red {
            background: linear-gradient(135deg, #ff0f0f, #ff7b00, #ff0055, #c800ff);
            background-size: 400% 400%;
            animation: holo-anim 3s ease infinite;
            opacity: 0.8;
        }

        @keyframes holo-anim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sticker-owned {
            transform: rotate(-0.5deg) scale(0.98);
            box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            border: 2px solid #fbbf24 !important;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        
        .pattern-bg {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col shadow-2xl z-20">
        <div class="p-4 bg-slate-950 border-b border-slate-800">
            <h1 class="oswald text-xl font-black italic tracking-tighter text-white text-center">WC2026 ALBUM</h1>
            <div class="flex gap-2 mt-3">
                <button onclick="exportData()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-[10px] py-1 rounded uppercase font-bold tracking-widest transition">Exporter</button>
                <button onclick="importData()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-[10px] py-1 rounded uppercase font-bold tracking-widest transition">Importer</button>
            </div>
            <button id="btn-toggle-mode" onclick="toggleAppMode()" class="w-full mt-2 bg-red-600 hover:bg-red-500 text-white text-[11px] py-2 rounded uppercase font-black tracking-widest transition shadow-lg">
                🔁 Gérer mes Doublons
            </button>
        </div>
        
        <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-3 custom-scrollbar"></nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden pattern-bg relative">
        
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 flex items-center justify-between z-10 h-20">
            
            <div id="header-album" class="flex-1 max-w-xl flex items-center justify-between w-full">
                <div class="flex-1 mr-8">
                    <div class="flex justify-between mb-1 items-end">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Progression Mondiale</span>
                        <span id="global-progress-text" class="oswald text-xl font-bold text-blue-400">0 / 979</span>
                    </div>
                    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden border border-slate-700">
                        <div id="global-progress-bar" class="bg-gradient-to-r from-blue-600 to-cyan-400 h-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>
                <div class="text-center bg-slate-800 p-2 px-4 rounded-xl border border-slate-700 shadow-inner">
                    <div id="global-percent" class="oswald text-2xl font-black text-white leading-none">0%</div>
                    <div class="text-[9px] uppercase text-slate-500 font-bold mt-1">Complété</div>
                </div>
            </div>

            <div id="header-doublon" class="hidden flex-1 flex items-center justify-between w-full">
                <div class="flex items-center gap-4">
                    <div class="bg-red-900/50 p-2 px-4 rounded-xl border border-red-500/50 shadow-inner text-center">
                        <div id="global-doublon-text" class="oswald text-3xl font-black text-red-400 leading-none">0</div>
                        <div class="text-[9px] uppercase text-red-300 font-bold mt-1 tracking-widest">Doublons au total</div>
                    </div>
                </div>
                <div class="text-right">
                    <h2 class="oswald text-2xl font-black text-white italic tracking-tighter">ALBUM DES DOUBLONS</h2>
                    <p class="text-xs text-slate-400">Ajoutez les cartes avec la barre de saisie en bas.</p>
                </div>
            </div>

        </header>

        <div class="flex-1 overflow-y-auto p-6 pb-24 custom-scrollbar flex flex-col items-center">
            <div class="w-full max-w-7xl">
                <h2 id="section-title" class="oswald text-4xl font-black text-white mb-6 uppercase italic tracking-tighter text-center lg:text-left">
                    Chargement...
                </h2>
                <div id="album-book-view" class="w-full"></div>
            </div>
        </div>

        <div id="doublon-entry-bar" class="hidden absolute bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-700 p-4 flex justify-center gap-3 items-center z-20 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
            <span class="oswald text-red-500 font-bold tracking-widest uppercase mr-2 hidden sm:block">Saisie Rapide :</span>
            
            <input type="text" id="manual-trigram" placeholder="EX: FRA" maxlength="3" class="bg-slate-950 border border-slate-700 text-white text-sm p-3 rounded-lg w-24 text-center uppercase font-bold focus:outline-none focus:border-red-500 transition-colors" onkeypress="if(event.key==='Enter') document.getElementById('manual-number').focus()">
            
            <input type="number" id="manual-number" min="1" max="20" placeholder="N°" class="bg-slate-950 border border-slate-700 text-white text-sm p-3 rounded-lg w-20 text-center font-bold focus:outline-none focus:border-red-500 transition-colors" onkeypress="if(event.key==='Enter') manualAction('ADD')">
            
            <button onclick="manualAction('ADD')" class="bg-green-600 hover:bg-green-500 text-white font-black uppercase text-sm px-6 py-3 rounded-lg shadow-md transition-colors flex items-center gap-2">
                ➕ <span class="hidden sm:block">Ajouter</span>
            </button>
            <button onclick="manualAction('DEL')" class="bg-red-600 hover:bg-red-500 text-white font-black uppercase text-sm px-4 py-3 rounded-lg shadow-md transition-colors flex items-center gap-2">
                ➖ <span class="hidden sm:block">Retirer</span>
            </button>
        </div>

    </main>

    <script>
        const fwcSections = [
            { id: 'FWC_INTRO1', label: 'Introduction', slots: [1,2,3,4] },
            { id: 'FWC_INTRO2', label: 'Villes Hôtes', slots: [5,6,7,8] },
            { id: 'FWC_HIST1', label: 'Légendes I', slots: [9,10,11,12,13] },
            { id: 'FWC_HIST2', label: 'Légendes II', slots: [14,15,16,17,18,19] }
        ];

        const groups = [
            { name: "Groupe A", color: "border-l-4 border-emerald-500", teams: [ {id:"MEX", label:"Mexique"}, {id:"RSA", label:"Afrique du S."}, {id:"KOR", label:"Corée du R."}, {id:"CZE", label:"Tchéquie"} ] },
            { name: "Groupe B", color: "border-l-4 border-red-500", teams: [ {id:"CAN", label:"Canada"}, {id:"BIH", label:"Bosnie-H."}, {id:"QAT", label:"Qatar"}, {id:"SUI", label:"Suisse"} ] },
            { name: "Groupe C", color: "border-l-4 border-yellow-500", teams: [ {id:"BRA", label:"Brésil"}, {id:"MAR", label:"Maroc"}, {id:"HAI", label:"Haïti"}, {id:"SCO", label:"Écosse"} ] },
            { name: "Groupe D", color: "border-l-4 border-blue-500", teams: [ {id:"USA", label:"États-Unis"}, {id:"PAR", label:"Paraguay"}, {id:"AUS", label:"Australie"}, {id:"TUR", label:"Turquie"} ] },
            { name: "Groupe E", color: "border-l-4 border-orange-500", teams: [ {id:"GER", label:"Allemagne"}, {id:"CUW", label:"Curaçao"}, {id:"CIV", label:"Côte d'Ivoire"}, {id:"ECU", label:"Équateur"} ] },
            { name: "Groupe F", color: "border-l-4 border-cyan-500", teams: [ {id:"NED", label:"Pays-Bas"}, {id:"JPN", label:"Japon"}, {id:"SWE", label:"Suède"}, {id:"TUN", label:"Tunisie"} ] },
            { name: "Groupe G", color: "border-l-4 border-purple-400", teams: [ {id:"BEL", label:"Belgique"}, {id:"EGY", label:"Égypte"}, {id:"IRN", label:"Iran"}, {id:"NZL", label:"Nouvelle-Z."} ] },
            { name: "Groupe H", color: "border-l-4 border-teal-500", teams: [ {id:"ESP", label:"Espagne"}, {id:"CPV", label:"Cap-Vert"}, {id:"KSA", label:"Arabie Saoudite"}, {id:"URU", label:"Uruguay"} ] },
            { name: "Groupe I", color: "border-l-4 border-indigo-600", teams: [ {id:"FRA", label:"France"}, {id:"SEN", label:"Sénégal"}, {id:"IRQ", label:"Irak"}, {id:"NOR", label:"Norvège"} ] },
            { name: "Groupe J", color: "border-l-4 border-pink-400", teams: [ {id:"ARG", label:"Argentine"}, {id:"ALG", label:"Algérie"}, {id:"AUT", label:"Autriche"}, {id:"JOR", label:"Jordanie"} ] },
            { name: "Groupe K", color: "border-l-4 border-rose-600", teams: [ {id:"POR", label:"Portugal"}, {id:"COD", label:"Congo RD"}, {id:"UZB", label:"Ouzbékistan"}, {id:"COL", label:"Colombie"} ] },
            { name: "Groupe L", color: "border-l-4 border-amber-800", teams: [ {id:"ENG", label:"Angleterre"}, {id:"CRO", label:"Croatie"}, {id:"GHA", label:"Ghana"}, {id:"PAN", label:"Panama"} ] }
        ];

        const teams = [];
        groups.forEach(g => g.teams.forEach(t => teams.push(t.id)));

        const allCardIds = [];
        for(let i=1; i<=19; i++) allCardIds.push(`FWC-${i}`);
        teams.forEach(t => {
            for(let i=1; i<=20; i++) allCardIds.push(`${t}-${i}`);
        });
        
        let userAlbumData = JSON.parse(localStorage.getItem('wc2026_album')) || {};
        let userDoublons = JSON.parse(localStorage.getItem('wc2026_doublons')) || {};

        let currentSection = 'FWC_INTRO1';
        let isDoublonMode = false;

        // Effets sonores
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 600, duration = 0.15) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function saveData() {
            localStorage.setItem('wc2026_album', JSON.stringify(userAlbumData));
            localStorage.setItem('wc2026_doublons', JSON.stringify(userDoublons));
            updateStats();
        }

        // Action quand on clique sur une carte en MODE ALBUM uniquement
        function toggleSticker(id) {
            if (isDoublonMode) return; // Sécurité : On ne clique pas en mode doublon
            userAlbumData[id] = !userAlbumData[id];
            saveData();
            renderMainContent();
            updateSidebarStats();
        }

        // Bascule entre les deux modes de l'application
        window.toggleAppMode = () => {
            isDoublonMode = !isDoublonMode;
            
            // UI Header
            document.getElementById('header-album').classList.toggle('hidden', isDoublonMode);
            document.getElementById('header-doublon').classList.toggle('hidden', !isDoublonMode);
            document.getElementById('doublon-entry-bar').classList.toggle('hidden', !isDoublonMode);
            
            // UI Bouton Sidebar
            const modeBtn = document.getElementById('btn-toggle-mode');
            if (isDoublonMode) {
                modeBtn.innerHTML = "📖 Revenir à l'Album";
                modeBtn.className = "w-full mt-2 bg-blue-600 hover:bg-blue-500 text-white text-[11px] py-2 rounded uppercase font-black tracking-widest transition shadow-lg";
            } else {
                modeBtn.innerHTML = "🔁 Gérer mes Doublons";
                modeBtn.className = "w-full mt-2 bg-red-600 hover:bg-red-500 text-white text-[11px] py-2 rounded uppercase font-black tracking-widest transition shadow-lg";
            }

            renderSidebar();
            renderMainContent();
            updateStats();
        }

        function updateStats() {
            // Stats Album
            const totalSlots = 19 + (48 * 20);
            const ownedCount = Object.values(userAlbumData).filter(v => v === true).length;
            const percent = Math.round((ownedCount / totalSlots) * 100);
            
            document.getElementById('global-progress-text').innerText = `${ownedCount} / ${totalSlots}`;
            document.getElementById('global-progress-bar').style.width = `${percent}%`;
            document.getElementById('global-percent').innerText = `${percent}%`;

            // Stats Doublons
            const totalDoublons = Object.values(userDoublons).reduce((a, b) => a + b, 0);
            document.getElementById('global-doublon-text').innerText = totalDoublons;
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-nav');
            const themeColorL = isDoublonMode ? 'border-l-red-500' : 'border-l-blue-500';
            const themeText = isDoublonMode ? 'text-red-400' : 'text-blue-400';
            const hoverText = isDoublonMode ? 'group-hover:text-red-400' : 'group-hover:text-blue-400';

            let html = "";
            
            html += `
            <div class="mb-4 bg-slate-950/60 p-2 rounded-xl border border-slate-700/50 border-l-4 ${themeColorL}">
                <div class="text-[10px] font-bold ${themeText} uppercase tracking-wider mb-1.5 px-1">Intro & Légendes</div>
                <div class="grid grid-cols-2 gap-1.5">
            `;
            fwcSections.forEach(sec => {
                html += `
                <button onclick="changeSection('${sec.id}')" class="group w-full text-left p-1.5 rounded-md bg-slate-900/60 hover:bg-slate-800 border border-slate-800/40 transition-all flex justify-between items-center">
                    <span class="text-[11px] font-bold text-slate-300 ${hoverText} transition-colors truncate">${sec.label}</span>
                    <span id="side-stat-${sec.id}" class="text-[9px] bg-slate-950 px-1 rounded text-slate-400 border border-slate-800">0</span>
                </button>
                `;
            });
            html += `</div></div>`;

            html += `<p class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mt-2 mb-3">Poules Coupe du Monde</p>`;
            
            groups.forEach(group => {
                html += `
                <div class="mb-4 bg-slate-950/40 p-2 rounded-xl border border-slate-800/60 ${group.color}">
                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 px-1">${group.name}</div>
                    <div class="grid grid-cols-2 gap-1.5">
                `;
                
                group.teams.forEach(team => {
                    html += `
                    <button onclick="changeSection('${team.id}')" class="group w-full text-left p-1.5 rounded-md bg-slate-900/60 hover:bg-slate-800 border border-slate-800/40 transition-all flex flex-col justify-between">
                        <span class="text-[11px] font-bold tracking-tight text-slate-300 ${hoverText} transition-colors truncate w-full">${team.label}</span>
                        <div class="w-full flex justify-between items-center mt-1">
                            <span class="text-[9px] font-black text-slate-500">${team.id}</span>
                            <span id="side-stat-${team.id}" class="text-[9px] bg-slate-950 px-1 py-0.2 rounded text-slate-400 border border-slate-800">0</span>
                        </div>
                    </button>
                    `;
                });
                
                html += `</div></div>`;
            });

            container.innerHTML = html;
            updateSidebarStats();
        }

        function updateSidebarStats() {
            fwcSections.forEach(sec => {
                let count = 0;
                sec.slots.forEach(n => { 
                    if (isDoublonMode) count += (userDoublons[`FWC-${n}`] || 0);
                    else if (userAlbumData[`FWC-${n}`]) count++; 
                });
                
                const el = document.getElementById(`side-stat-${sec.id}`);
                if(el) {
                    if (isDoublonMode) {
                        el.innerText = count > 0 ? `+${count}` : `0`;
                        el.className = count > 0 ? 'text-[9px] bg-red-500/20 px-1 rounded text-red-400 border border-red-500/30' : 'text-[9px] bg-slate-950 px-1 rounded text-slate-400 border border-slate-800';
                    } else {
                        el.innerText = `${count}/${sec.slots.length}`;
                        el.className = count === sec.slots.length ? 'text-[9px] bg-green-500/20 px-1 rounded text-green-400 border border-green-500/30' : 'text-[9px] bg-slate-950 px-1 rounded text-slate-400 border border-slate-800';
                    }
                }
            });

            teams.forEach(team => {
                let count = 0;
                for(let i=1; i<=20; i++) {
                    if (isDoublonMode) count += (userDoublons[`${team}-${i}`] || 0);
                    else if(userAlbumData[`${team}-${i}`]) count++;
                }
                const el = document.getElementById(`side-stat-${team}`);
                if(el) {
                    if (isDoublonMode) {
                        el.innerText = count > 0 ? `+${count}` : `0`;
                        el.className = count > 0 ? 'text-[9px] bg-red-500/20 px-1 py-0.2 rounded text-red-400 border border-red-500/30' : 'text-[9px] bg-slate-950 px-1 py-0.2 rounded text-slate-400 border border-slate-800';
                    } else {
                        el.innerText = `${count}/20`;
                        el.className = count === 20 ? 'text-[9px] bg-green-500/20 px-1 py-0.2 rounded text-green-400 border border-green-500/30' : 'text-[9px] bg-slate-950 px-1 py-0.2 rounded text-slate-400 border border-slate-800';
                    }
                }
            });
        }

        window.changeSection = (id) => {
            currentSection = id;
            renderMainContent();
        }

        // Création visuelle d'une carte (S'adapte si on est en Album ou Doublons)
        function createCardElement(id, isSpecial, numStr) {
            const isOwnedAlbum = userAlbumData[id] === true;
            const dupQty = userDoublons[id] || 0;
            const card = document.createElement('div');
            const num = parseInt(numStr);
            
            let aspectClass = "aspect-[3/4]";
            let gridSpanClass = "";
            
            if (!isSpecial && num === 13) {
                aspectClass = "aspect-auto h-full";
                gridSpanClass = "col-span-2";
            }

            card.className = `${gridSpanClass} w-full h-full relative`;
            const innerCard = document.createElement('div');

            if (isDoublonMode) {
                // --- VISUEL MODE DOUBLONS ---
                const hasDupe = dupQty > 0;
                innerCard.className = `group relative w-full h-full ${aspectClass} rounded-xl border-2 transition-all duration-300 flex items-center justify-center overflow-hidden
                    ${hasDupe ? 'sticker-owned border-red-500' : 'border-slate-800/50 bg-slate-900/20'}`;
                
                innerCard.onclick = null; // Pas de clic en mode doublon

                if (hasDupe) {
                    innerCard.innerHTML = `
                        <div class="absolute inset-0 ${isSpecial ? 'holographic-red' : 'bg-gradient-to-br from-red-700 to-rose-900'}"></div>
                        <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
                        <span class="z-10 oswald text-4xl font-black italic text-white drop-shadow-lg scale-110">${numStr}</span>
                        <div class="absolute top-2 left-2 text-[10px] font-bold text-white/50 z-10">${id.split('-')[0]}</div>
                        <div class="absolute bottom-2 right-2 bg-white text-red-700 font-black text-xs px-2 py-0.5 rounded-full z-10 shadow-md">
                            x${dupQty}
                        </div>
                    `;
                } else {
                    innerCard.innerHTML = `
                        <div class="text-center p-2 z-10 opacity-30">
                            <div class="oswald text-slate-600 text-2xl font-bold">${numStr}</div>
                            <div class="text-[10px] text-slate-700 font-black tracking-wider uppercase">${id.split('-')[0]}</div>
                        </div>
                    `;
                }

            } else {
                // --- VISUEL MODE ALBUM ---
                innerCard.className = `group relative w-full h-full ${aspectClass} rounded-xl border-2 cursor-pointer transition-all duration-300 flex items-center justify-center overflow-hidden
                    ${isOwnedAlbum ? 'sticker-owned border-transparent' : 'border-slate-800 bg-slate-900/40 hover:border-slate-600'}`;
                
                innerCard.onclick = () => toggleSticker(id);

                if (isOwnedAlbum) {
                    innerCard.innerHTML = `
                        <div class="absolute inset-0 ${isSpecial ? 'holographic' : 'bg-gradient-to-br from-blue-700 to-indigo-900'}"></div>
                        <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
                        <span class="z-10 oswald text-3xl font-black italic text-white drop-shadow-lg group-hover:scale-110 transition-transform">${numStr}</span>
                        <div class="absolute top-2 left-2 text-[10px] font-bold text-white/50 z-10">${id.split('-')[0]}</div>
                    `;
                } else {
                    innerCard.innerHTML = `
                        <div class="text-center p-2 z-10">
                            <div class="oswald text-slate-600 text-2xl font-bold group-hover:text-slate-400 transition-colors">${numStr}</div>
                            <div class="text-[10px] text-slate-700 font-black tracking-wider uppercase">${id.split('-')[0]}</div>
                        </div>
                    `;
                }

                // Affichage d'une petite pastille jaune si on a ce doublon (pratique même en mode album)
                if (dupQty > 0) {
                    innerCard.innerHTML += `
                        <div class="absolute bottom-2 right-2 bg-amber-500 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-full z-10 shadow-md">
                            x${dupQty}
                        </div>
                    `;
                }
            }

            card.appendChild(innerCard);
            return card;
        }

        // --- SAISIE MANUELLE DES DOUBLONS ---
        window.manualAction = (mode) => {
            const rawTrigram = document.getElementById('manual-trigram').value.trim().toUpperCase();
            const numStr = document.getElementById('manual-number').value;
            const num = parseInt(numStr, 10);

            if (!rawTrigram || (rawTrigram !== 'FWC' && !teams.includes(rawTrigram))) return;
            if (!num || isNaN(num)) return;

            const maxNum = rawTrigram === 'FWC' ? 19 : 20;
            if (num < 1 || num > maxNum) return;

            const cardId = `${rawTrigram}-${num}`;
            let currentQty = userDoublons[cardId] || 0;

            if (mode === 'ADD') {
                userDoublons[cardId] = currentQty + 1;
                playBeep(650, 0.1);
            } else if (mode === 'DEL' && currentQty > 0) {
                userDoublons[cardId] = currentQty - 1;
                playBeep(400, 0.15);
            }
            
            saveData();
            
            // Auto-Switch : Si tu tapes une carte d'une autre équipe, l'écran bascule dessus pour que tu voies l'ajout !
            if (currentSection !== rawTrigram) {
                let targetSection = rawTrigram;
                if (rawTrigram === 'FWC') {
                    const fwcSec = fwcSections.find(s => s.slots.includes(num));
                    if(fwcSec) targetSection = fwcSec.id;
                }
                currentSection = targetSection;
            }

            renderSidebar();
            renderMainContent();

            // On vide juste le numéro, pour pouvoir enchaîner très vite les cartes du même pays
            const inputField = document.getElementById('manual-number');
            inputField.value = '';
            inputField.focus();
        };

        // --- AFFICHAGE DU CARNET ---
        function renderMainContent() {
            const bookContainer = document.getElementById('album-book-view');
            const title = document.getElementById('section-title');
            bookContainer.innerHTML = '';
            
            if (currentSection.startsWith('FWC')) {
                const sec = fwcSections.find(s => s.id === currentSection);
                title.innerText = `Section Spéciale : ${sec.label}`;
                
                const grid = document.createElement('div');
                grid.className = `grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 p-6 rounded-2xl border ${isDoublonMode ? 'bg-red-950/20 border-red-900/30' : 'bg-slate-900/30 border-slate-800/60'}`;
                
                sec.slots.forEach(n => {
                    const card = createCardElement(`FWC-${n}`, true, n.toString());
                    grid.appendChild(card);
                });
                bookContainer.appendChild(grid);
            } 
            else {
                let fullTeamName = currentSection;
                for (let g of groups) {
                    let tMatch = g.teams.find(t => t.id === currentSection);
                    if(tMatch) { fullTeamName = tMatch.label; break; }
                }
                title.innerText = `Équipe : ${fullTeamName} (${currentSection})`;
                
                const bookLayout = document.createElement('div');
                bookLayout.className = `flex flex-col lg:flex-row gap-6 p-4 lg:p-8 rounded-3xl border shadow-2xl backdrop-blur-sm relative ${isDoublonMode ? 'bg-red-950/10 border-red-900/30' : 'bg-slate-950/40 border-slate-800/80'}`;
                
                const spine = document.createElement('div');
                spine.className = `hidden lg:block absolute left-1/2 top-0 bottom-0 w-[2px] transform -translate-x-1/2 ${isDoublonMode ? 'bg-gradient-to-b from-transparent via-red-900/50 to-transparent' : 'bg-gradient-to-b from-transparent via-slate-800 to-transparent'}`;
                bookLayout.appendChild(spine);

                const textColor = isDoublonMode ? 'text-red-500' : 'text-slate-500';
                const borderColor = isDoublonMode ? 'border-red-900/40' : 'border-slate-800/60';

                const leftPage = document.createElement('div');
                leftPage.className = "flex-1 flex flex-col";
                leftPage.innerHTML = `<div class="oswald ${textColor} font-bold tracking-widest text-xs mb-4 uppercase border-b ${borderColor} pb-2 flex justify-between"><span>Page Gauche</span> <span>${currentSection} 1-10</span></div>`;
                
                const leftGrid = document.createElement('div');
                leftGrid.className = "grid grid-cols-4 gap-3";
                
                const dummy1 = document.createElement('div');
                dummy1.className = "aspect-[3/4] pointer-events-none opacity-0 hidden sm:block";
                const dummy2 = document.createElement('div');
                dummy2.className = "aspect-[3/4] pointer-events-none opacity-0 hidden sm:block";
                leftGrid.appendChild(dummy1);
                leftGrid.appendChild(dummy2);
                
                for (let i = 1; i <= 10; i++) {
                    const card = createCardElement(`${currentSection}-${i}`, false, i.toString());
                    leftGrid.appendChild(card);
                }
                leftPage.appendChild(leftGrid);

                const rightPage = document.createElement('div');
                rightPage.className = "flex-1 flex flex-col mt-8 lg:mt-0";
                rightPage.innerHTML = `<div class="oswald ${textColor} font-bold tracking-widest text-xs mb-4 uppercase border-b ${borderColor} pb-2 flex justify-between"><span>${currentSection} 11-20</span> <span>Page Droite</span></div>`;
                
                const rightGrid = document.createElement('div');
                rightGrid.className = "grid grid-cols-4 gap-3";
                
                for (let i = 11; i <= 17; i++) {
                    const card = createCardElement(`${currentSection}-${i}`, false, i.toString());
                    rightGrid.appendChild(card);
                }

                const drawShiftDummy = document.createElement('div');
                drawShiftDummy.className = "aspect-[3/4] pointer-events-none opacity-0";
                rightGrid.appendChild(drawShiftDummy);

                for (let i = 18; i <= 20; i++) {
                    const card = createCardElement(`${currentSection}-${i}`, false, i.toString());
                    rightGrid.appendChild(card);
                }
                
                rightPage.appendChild(rightGrid);
                bookLayout.appendChild(leftPage);
                bookLayout.appendChild(rightPage);
                bookContainer.appendChild(bookLayout);
            }
        }

        // --- EXPORT / IMPORT ---
        window.exportData = () => {
            let parts = [];
            allCardIds.forEach((id, index) => {
                let inAlbum = userAlbumData[id] === true ? 1 : 0;
                let dupQty = userDoublons[id] || 0;

                if (inAlbum > 0 || dupQty > 0) {
                    if (inAlbum === 1 && dupQty === 0) {
                        parts.push(index.toString(36));
                    } else {
                        parts.push(`${index.toString(36)}-${inAlbum}-${dupQty}`);
                    }
                }
            });
            const code = parts.join('.'); 
            
            const tempInput = document.createElement('textarea');
            document.body.appendChild(tempInput);
            tempInput.value = code;
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            alert("Code ultra-court copié dans le presse-papier !");
        };

        window.importData = () => {
            const code = prompt("Colle ici le code de collection reçu :");
            if (!code) return;
            try {
                let decodedAlbum = {};
                let decodedDoublons = {};
                
                if (code.startsWith('ey') || code.includes('{')) {
                    const jsonStr = code.startsWith('ey') ? atob(code) : code;
                    const parsed = JSON.parse(jsonStr);
                    Object.keys(parsed).forEach(key => {
                        if (typeof parsed[key] === 'number') {
                            decodedAlbum[key] = parsed[key] > 0;
                            if (parsed[key] > 1) decodedDoublons[key] = parsed[key] - 1;
                        } else {
                            decodedAlbum[key] = parsed[key] === true;
                        }
                    });
                } else {
                    const parts = code.split('.');
                    parts.forEach(p => {
                        if (!p) return;
                        const split = p.split('-');
                        const index = parseInt(split[0], 36);
                        const inAlbum = split.length > 1 ? parseInt(split[1], 10) : 1;
                        const dupQty = split.length > 2 ? parseInt(split[2], 10) : 0;
                        if (index >= 0 && index < allCardIds.length) {
                            const id = allCardIds[index];
                            decodedAlbum[id] = inAlbum === 1;
                            decodedDoublons[id] = dupQty;
                        }
                    });
                }

                if (confirm("Voulez-vous fusionner cette collection avec la vôtre ?")) {
                    Object.keys(decodedAlbum).forEach(key => {
                        userAlbumData[key] = userAlbumData[key] || decodedAlbum[key];
                    });
                    Object.keys(decodedDoublons).forEach(key => {
                        userDoublons[key] = Math.max(userDoublons[key] || 0, decodedDoublons[key]);
                    });
                    saveData();
                    location.reload();
                }
            } catch (e) {
                alert("Code invalide ou corrompu !");
            }
        };

        // Démarrage
        renderSidebar();
        renderMainContent();
        updateStats();

    </script>
</body>
</html>
